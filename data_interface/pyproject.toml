[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csmap-client"
version = "0.1.0"
description = "Dependency-free Python client for the CSMaP Social Archive"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["csmap_client*"]
